<svg viewBox="0 0 1000 927" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Selected projects by Yousef El-khawanki">
  <style>
    :root { --ink:#000000; --paper:#FFFFFF; }
    @media (prefers-color-scheme:dark) { :root { --ink:#FFFFFF; --paper:#000000; --ghost:#FFFFFF; } }
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .row { opacity:0; animation:reveal .55s cubic-bezier(.2,.7,.2,1) forwards; }
    .rule { stroke:var(--ink); stroke-width:1; }
    .title { fill:var(--ink); font-size:17px; font-weight:700; letter-spacing:.8px; }
    .copy { fill:var(--ink); font-size:12px; }
    .meta { fill:var(--ink); font-size:11px; letter-spacing:.4px; }
    @keyframes reveal { from { opacity:0; } to { opacity:1; } }
    .r1{animation-delay:.05s}.r2{animation-delay:.10s}.r3{animation-delay:.15s}.r4{animation-delay:.20s}.r5{animation-delay:.25s}
    .r6{animation-delay:.30s}.r7{animation-delay:.35s}.r8{animation-delay:.40s}.r9{animation-delay:.45s}.r10{animation-delay:.50s}
    .r11{animation-delay:.55s}.r12{animation-delay:.60s}.r13{animation-delay:.65s}.r14{animation-delay:.70s}.r15{animation-delay:.75s}
    @media (prefers-reduced-motion:reduce) { .row { animation:none; opacity:1; } }
  :root { --bone:#FFFFFF; --muted:#FFFFFF; --dim:#FFFFFF; --rule:#FFFFFF; --accent:#FFFFFF; --node-bg:#000000; --core-bg:#000000; --ghost:#FFFFFF; --ink:#FFFFFF; --paper:#000000; --ghost:#FFFFFF; }
</style>
  <g class="mono">
    <g class="row r1" transform="translate(0 20)">
      <text class="title" x="48" y="24">01 / HEALTHCARE PLATFORMS</text>
      <text class="copy" x="48" y="49">Enterprise healthcare interfaces and workflows supporting clinical and operational use cases at Health Insights Asia.</text>
      <text class="copy" x="48" y="68">Data-intensive tables, dynamic forms and integrations with internal hospital systems and APIs.</text>
      <text class="meta" x="48" y="87">REACT · TYPESCRIPT · FRONTEND ARCHITECTURE · COMPONENT SYSTEMS · HEALTHCARE</text>
      <line class="rule" x1="48" y1="104" x2="952" y2="104"/>
    </g>
    <g class="row r2" transform="translate(0 150)">
      <text class="title" x="48" y="24">02 / HEALTH INSIGHTS — COMPANY PROFILE WEBSITE</text>
      <text class="copy" x="48" y="49">Modern, responsive corporate website showcasing Health Insights' products, services and company presence.</text>
      <text class="meta" x="48" y="68">CORPORATE WEBSITE · RESPONSIVE DESIGN · HEALTH INSIGHTS ASIA</text>
      <line class="rule" x1="48" y1="85" x2="952" y2="85"/>
    </g>
    <g class="row r3" transform="translate(0 261)">
      <text class="title" x="48" y="24">03 / MADINET MASR / HYDE PARK / LMD</text>
      <text class="copy" x="48" y="49">Real-estate platform work focused on reusable components, interactive experiences and frontend consistency.</text>
      <text class="meta" x="48" y="68">PARALLEL · REAL ESTATE · REUSABLE COMPONENTS · INTERACTIVE UI</text>
      <line class="rule" x1="48" y1="85" x2="952" y2="85"/>
    </g>
    <g class="row r4" transform="translate(0 372)">
      <text class="title" x="48" y="24">04 / WALIMA / SUNBULAH</text>
      <text class="copy" x="48" y="49">E-commerce experience with product filtering and personalized recommendations.</text>
      <text class="meta" x="48" y="68">PARALLEL · E-COMMERCE · PRODUCT FILTERING · RECOMMENDATIONS</text>
      <line class="rule" x1="48" y1="85" x2="952" y2="85"/>
    </g>
    <g class="row r5" transform="translate(0 483)">
      <text class="title" x="48" y="24">05 / XPLOR PLATFORM</text>
      <text class="copy" x="48" y="49">Configurable landing-page builder for travel operators using reusable components and scalable content structures.</text>
      <text class="meta" x="48" y="68">PARALLEL · TRAVEL · LANDING-PAGE BUILDER · REUSABLE COMPONENTS</text>
      <line class="rule" x1="48" y1="85" x2="952" y2="85"/>
    </g>
    <g class="row r6" transform="translate(0 594)">
      <text class="title" x="48" y="24">06 / LEARNING MANAGEMENT SYSTEM</text>
      <text class="copy" x="48" y="49">Advanced LMS with interactive functionality and usability-focused improvements — frontend development led at EraaSoft.</text>
      <text class="meta" x="48" y="68">ERAASOFT · EDUCATION · FRONTEND LEAD</text>
      <line class="rule" x1="48" y1="85" x2="952" y2="85"/>
    </g>
    <g class="row r7" transform="translate(0 705)">
      <text class="title" x="48" y="24">07 / RESOURCE HUB</text>
      <text class="copy" x="48" y="49">Centralized educational-content platform built as a freelance project.</text>
      <text class="meta" x="48" y="68">FREELANCE · EDUCATIONAL CONTENT</text>
      <line class="rule" x1="48" y1="85" x2="952" y2="85"/>
    </g>
    <g class="row r8" transform="translate(0 816)">
      <text class="title" x="48" y="24">08 / SBS TRELLO CLONE</text>
      <text class="copy" x="48" y="49">Task-management application with workflow organization.</text>
      <text class="meta" x="48" y="68">FREELANCE · TASK MANAGEMENT</text>
      <line class="rule" x1="48" y1="85" x2="952" y2="85"/>
    </g>
  </g>
</svg>
