    <text class="mono" x="136" y="448" font-size="15" fill="var(--bone)">Frontend Instructor &amp; Mentor · Technical Trainer</text>
    <text class="mono" x="136" y="474" font-size="14" fill="var(--muted)">Instant Software Solutions · EraaSoft · AMIT Learning · MIC · Dev Academy</text>
    <text class="mono" x="136" y="496" font-size="14" fill="var(--muted)">university programs — 10th of Ramadan University · Modern Academy</text>
